services:
  - type: web
    name: cyberai-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: demo
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
