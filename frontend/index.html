<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERAI — Kiberxavfsizlik va Himoyalanish AI Yordamchisi</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300E5A8'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="main-sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo-wrapper">
          <svg class="logo-icon" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span class="logo-text">CYBERAI</span>
        </a>
        <button class="toggle-sidebar-btn" id="toggle-sidebar-btn" title="Yon panelni yopish/ochish">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <a href="/" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span class="nav-text" data-i18n="new_chat">AI Suhbat</span>
        </a>
        <a href="/analyzer" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          <span class="nav-text" data-i18n="code_analyzer">Kod Tahlili</span>
        </a>
        <a href="/scanner" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span class="nav-text" data-i18n="website_scanner">Sayt Xavfsizligi</span>
        </a>
        <a href="/admin" class="nav-item" id="admin-nav-item" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-text" data-i18n="admin_panel">Admin Panel</span>
        </a>
      </nav>

      <!-- New Chat Button -->
      <div class="new-chat-wrapper">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span data-i18n="new_chat">Yangi Suhbat</span>
        </button>
      </div>

      <!-- History Section -->
      <div class="sidebar-section-title" data-i18n="chat_history">Suhbatlar tarixi</div>
      <div class="history-section" id="chat-history-list">
        <!-- Dynamically populated via chat.js -->
      </div>

      <!-- Sidebar Footer / User Profile -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="user-avatar-initial">U</div>
          <div class="user-meta">
            <div class="user-name" id="user-display-name">Foydalanuvchi</div>
            <div class="user-role-badge" id="user-role-badge">USER</div>
          </div>
        </div>
        <button class="history-btn" id="logout-btn" title="Chiqish">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navigation Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="toggle-sidebar-btn" id="mobile-menu-btn" style="display: none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="page-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00E5A8" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>CYBERAI Chat</span>
          </div>
          <div class="status-pill">
            <span class="status-dot"></span>
            <span data-i18n="online_status">Himoya Faol</span>
          </div>
        </div>

        <div class="top-bar-right">
          <!-- AI API Key Connection Button -->
          <button class="btn btn-secondary" id="open-api-modal-btn" style="padding: 0.4rem 0.85rem; font-size: 0.85rem; gap: 0.4rem;" title="AI Tokenini sozlash">
            <span>🔑</span>
            <span>API Kalit Ulash</span>
          </button>

          <!-- AI Model Selector -->
          <select class="select-input" id="model-selector" title="AI Modelini tanlash">
            <option value="gpt-4o-mini">CYBERAI Guard (gpt-4o-mini)</option>
            <option value="gpt-4o">CYBERAI DeepSec (gpt-4o)</option>
            <option value="llama3">Ollama Local (llama3)</option>
            <option value="demo">Lokal Mudofaa Modeli</option>
          </select>

          <!-- Language Selector -->
          <select class="select-input" id="lang-selector" title="Tilni tanlash">
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Русский</option>
          </select>
        </div>
      </header>

      <!-- Chat Stream View Area -->
      <div class="chat-container">
        <div class="messages-list" id="chat-messages">
          <!-- Chat messages or welcome placeholder rendered dynamically -->
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-input-wrapper">
          <textarea
            id="chat-input"
            class="chat-textarea"
            placeholder="Kiberxavfsizlik, kod himoyasi yoki OWASP bo'yicha savolingizni yozing..."
            data-i18n="input_placeholder"
            rows="1"
          ></textarea>

          <div class="chat-input-footer">
            <div class="chat-controls-left">
              <span style="font-size: 0.75rem; color: var(--text-muted);">Shift + Enter yangi qator</span>
            </div>

            <div class="send-btn-group">
              <button class="btn btn-stop" id="stop-btn" style="display: none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
                <span data-i18n="stop">To'xtatish</span>
              </button>

              <button class="btn btn-primary" id="send-btn">
                <span data-i18n="send">Yuborish</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- AI Token Connection Modal -->
  <div class="modal-overlay" id="api-key-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="display: flex; align-items: center; gap: 0.5rem;">
          <span>🔑</span>
          <span>AI Provayder Kalitini (Token) Ulash</span>
        </h3>
        <button class="modal-close-btn" id="close-api-modal-btn">&times;</button>
      </div>
      <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">
        OpenAI, Groq yoki boshqa OpenAI-mos provayder kalitini ulab, real vaqtda jonli generatsiyadan foydalaning.
      </div>
      <div class="form-group">
        <label class="form-label">Provayder:</label>
        <select id="modal-ai-provider" class="select-input" style="width: 100%;">
          <option value="openai">OpenAI (Rasmiy: api.openai.com)</option>
          <option value="groq">Groq (Tezkor Llama: api.groq.com)</option>
          <option value="openrouter">OpenRouter (openrouter.ai)</option>
          <option value="ollama">Mahalliy Ollama (localhost:11434)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">API Kalit (Token):</label>
        <input type="password" id="modal-ai-key" class="form-input" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Model nomi (Ixtiyoriy):</label>
        <input type="text" id="modal-ai-model" class="form-input" placeholder="gpt-4o-mini yoki llama-3.3-70b-versatile">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.25rem;">
        <button class="btn btn-secondary" id="cancel-api-modal-btn">Bekor qilish</button>
        <button class="btn btn-primary" id="save-api-modal-btn">Saqlash va Ulash</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
