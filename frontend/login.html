<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — CYBERAI Kiberxavfsizlik Platformasi</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300E5A8'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-wrapper">
          <svg class="logo-icon" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span class="logo-text">CYBERAI</span>
        </div>
        <h1 class="auth-title">Xavfsiz Tizimga Kirish</h1>
        <p class="auth-subtitle">AI Kiberxavfsizlik va mudofaa vositalariga ulanish</p>
      </div>

      <div id="auth-error-banner" style="display: none; background: rgba(255, 75, 114, 0.15); border: 1px solid var(--severity-critical); color: var(--severity-critical); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Foydalanuvchi nomi yoki Email</label>
          <input type="text" id="login-username" class="form-input" placeholder="admin yoki foydalanuvchi" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Maxfiy Parol</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
          Tizimga Kirish
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
        Akkauntingiz yo'qmi?
        <a href="/register" style="font-weight: 600; color: var(--accent-primary);">Ro'yxatdan o'tish</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
